name: Sync simulator source to existing Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - "hf_space/**"
      - ".streamlit/config.toml"
      - "research/__init__.py"
      - "research/data.py"
      - "research/models.py"
      - "research/portfolio.py"
      - "research/max_pain.py"
      - "research/dealer_methods.py"
      - "web/index.html"
      - "web/style.css"
      - "web/main.js"
      - "deploy/huggingface/**"
      - "scripts/package_hf_space.py"
      - "scripts/upload_hf_space.py"
      - ".github/workflows/huggingface.yml"
  workflow_dispatch:
    inputs:
      space_id:
        description: "Existing personal public Docker Space (owner/name); optional override of HF_SPACE_ID / default personal Space"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: huggingface-simulator-source-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_SPACE_ID: ${{ inputs.space_id || vars.HF_SPACE_ID || 'Rexymiao/alpha-trading-lab' }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Check existing Space configuration
        id: configured
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HF sync skipped: set repository secret HF_TOKEN; optional variable HF_SPACE_ID overrides the default personal Space. No Space was created and no code was uploaded."
            echo "Hugging Face sync was skipped because HF_TOKEN or HF_SPACE_ID is missing. No deployment occurred." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout source
        if: steps.configured.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        if: steps.configured.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deployment client only
        if: steps.configured.outputs.ready == 'true'
        run: python -m pip install --disable-pip-version-check huggingface_hub==2.4.0
      - name: Package allowlisted source
        if: steps.configured.outputs.ready == 'true'
        run: python scripts/package_hf_space.py
      - name: Upload to the existing CPU Basic Docker Space
        if: steps.configured.outputs.ready == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/upload_hf_space.py --bundle ../outputs/hf-space-bundle --space-id "$HF_SPACE_ID"
          echo "Allowlisted simulator source was uploaded. Container build and application health are not verified by this workflow." >> "$GITHUB_STEP_SUMMARY"
