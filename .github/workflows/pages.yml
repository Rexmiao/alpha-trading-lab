name: Deploy teaching site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/validate_public_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate public teaching files
        run: python scripts/validate_public_site.py
      - name: Check first-time Pages setup
        id: pages-ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/pages-status.json" --write-out "%{http_code}" \
            --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Enable Pages in repository Settings, select GitHub Actions, then rerun this workflow."
            echo "Pages is not enabled yet. Open https://github.com/$GITHUB_REPOSITORY/settings/pages, select GitHub Actions as Source, then rerun this workflow." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Pages setup check returned HTTP $status"
            exit 1
          fi
      - name: Configure Pages
        if: steps.pages-ready.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload teaching site
        if: steps.pages-ready.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy to GitHub Pages
        if: steps.pages-ready.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
